name: ios-ci

# На каждый пуш не гоняем: те же тесты уже прошли локально в `pre-push`
# за 27 секунд против пяти минут здесь, и второй раз тот же ответ ничего
# не добавляет. Раннер оставлен там, где он отвечает на другой вопрос, —
# «собирается ли оно на чистой машине», а не «зелены ли тесты»:
#
#   * перед релизом (тег);
#   * вручную, когда есть подозрение на разницу окружений — CI уже ловил
#     то, что локальный прогон пропускал.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # Версию Xcode не хардкодим: образы раннеров меняются, и упавший
      # xcode-select маскирует настоящую причину. Нужен 26+ — проект
      # использует objectVersion 77 и `nonisolated` на типах.
      - name: Выбрать Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Доступны:"; ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$latest"
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 26 ]; then
            echo "::error::Нужен Xcode 26+, на раннере $major"
            exit 1
          fi

      # Имя симулятора тоже зависит от образа — берём любой доступный iPhone.
      - name: Выбрать симулятор
        id: sim
        run: |
          set -euo pipefail
          name=$(xcrun simctl list devices available \
                 | grep -oE '^ +iPhone [^(]+' | sed 's/ *$//' | head -1 | xargs)
          echo "Симулятор: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Тесты
        run: |
          set -o pipefail
          xcodebuild test \
            -project plateful.xcodeproj \
            -scheme plateful \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath TestResults.xcresult \
            -quiet

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results
          path: TestResults.xcresult
