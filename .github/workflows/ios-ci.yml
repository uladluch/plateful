name: ios-ci

# macOS-раннеры тарифицируются с множителем 10, поэтому фильтр по путям
# жёсткий: гоняем только когда меняется само приложение или его тесты.
on:
  push:
    paths:
      - "plateful/**"
      - "platefulTests/**"
      - "plateful.xcodeproj/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "plateful/**"
      - "platefulTests/**"

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Тесты
        run: |
          xcodebuild test \
            -project plateful.xcodeproj \
            -scheme plateful \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify --renderer github-actions
        shell: bash

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results
          path: TestResults.xcresult
