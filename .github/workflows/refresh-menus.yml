name: refresh-menus

# Раз в неделю: сверить меню сетей, добрать официальные снимки, выложить пак.
# Ручной запуск оставлен для внеплановых обновлений.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      chains:
        description: "Сети через пробел (пусто — кому пора по crawl_queue)"
        required: false
      version:
        description: "Версия пака (пусто — auto: только если готовых не убыло)"
        required: false
      dry_run:
        description: "Не писать в базу — только показать план и готовность"
        type: boolean
        default: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: tnlmtyhuuqpjwuhzximh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: pip install -r backend/requirements.txt pillow
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Сид нужен как справочник ключей позиций при сопоставлении.
      - name: MenuStat raw из релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download menustat-2018 -p menustat-2018.tab -D backend/data/raw
      - run: python3 backend/scripts/build_seed.py

      # Кого обновлять, решает crawl_queue в базе; как — chains.source_kind
      # и chains.photo_source_kind. Пак публикуется сам, если готовых сетей
      # не стало меньше, чем в прошлый раз (readiness_runs).
      - name: Обновить сети
        env:
          CHAINS: ${{ inputs.chains }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -- ${CHAINS:---due}
          [ "$DRY_RUN" = "true" ] || set -- "$@" --apply --publish "${VERSION:-auto}"
          python3 backend/scripts/refresh_chain.py "$@"

      # Отчёт видно в логе запуска: сколько блюд снято и сколько снимков есть.
      - name: Сводка
        if: always()
        run: |
          python3 - <<'PY'
          import json, collections, pathlib
          pack = json.loads(pathlib.Path("backend/data/catalog.json").read_text())
          print(f"позиций в сиде: {len(pack['items'])}")
          PY
