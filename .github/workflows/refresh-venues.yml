name: refresh-venues

# Раз в месяц: заново забрать точки сетей и их часы работы.
#
# Часы меняются чаще, чем выходит пак, и живут не в паке, а в базе —
# приложение спрашивает их запросом. Поэтому обновление отдельное от
# `refresh-menus` и не требует публикации версии.
on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      chains:
        description: "Слаги сетей через пробел (пусто — все, что умеем)"
        required: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: tnlmtyhuuqpjwuhzximh

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Обход McDonald's — семь тысяч клеток с паузой в секунду, плюс дробление
    # над плотными штатами: около двух часов. Клетки мельче не сделать —
    # локатор не смотрит дальше 35 км от точки запроса.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: python3 backend/scripts/import_venues.py ${{ inputs.chains }}

      - name: Сводка
        if: always()
        run: |
          cat > /tmp/venues.sql <<'SQL'
          select c.name, count(*) as venues,
                 count(v.hours) as with_hours,
                 max(v.observed_at)::date as last_seen
            from venues v join chains c on c.id = v.chain_id
           group by c.name order by 2 desc;
          SQL
          supabase db query --linked --agent=no -f /tmp/venues.sql
