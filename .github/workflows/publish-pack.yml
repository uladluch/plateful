name: publish-pack

# Ручной запуск. Нужен один секрет:
#   SUPABASE_ACCESS_TOKEN — Account → Access Tokens в дашборде Supabase.
# Пароль базы и service-ключ не нужны: CLI поднимает временную роль сам.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия пака"
        required: true

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: tnlmtyhuuqpjwuhzximh

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: ./backend/scripts/publish_pack.sh "${{ inputs.version }}"
