name: backend-ci

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**"]

jobs:
  build-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Сырой MenuStat — 31 МБ с Harvard Dataverse. Кэшируем, чтобы не дёргать
      # зеркало на каждый пуш; ключ фиксирован, файл 2018 года не меняется.
      # Сырой MenuStat (31 МБ, CC0) зафиксирован как ассет релиза menustat-2018,
      # чтобы конвейер не зависел от доступности Harvard Dataverse.
      - name: MenuStat raw из релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download menustat-2018 -p menustat-2018.tab -D backend/data/raw

      - run: pip install -r backend/requirements.txt
      - run: python3 -m unittest discover -s backend/tests -v
      - run: python3 backend/scripts/build_seed.py

      # Пак в бандле обязан совпадать с тем, что собирается из исходника.
      - name: Пак в репозитории актуален
        run: git diff --exit-code -- plateful/Resources/seed-pack.json

      - uses: actions/upload-artifact@v5
        with:
          name: seed-pack
          path: |
            backend/data/manifest.json
            backend/data/problems.csv
            backend/data/*.deflate
